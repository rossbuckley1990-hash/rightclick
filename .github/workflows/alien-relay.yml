name: RIGHTCLICK Alien Relay

on:
  push:
    branches:
      - experiment/alien-relay-20261007
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alien-relay:
    name: Remote Ubuntu recursive image-understanding proof
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out experiment branch
        uses: actions/checkout@v4

      - name: Acquire learned clients
        shell: bash
        run: |
          set -e
          python3 -m venv alien-venv
          alien-venv/bin/python -m pip install --disable-pip-version-check --no-input gradio pillow huggingface_hub >gradio-install.log 2>&1

      - name: Recurse from generated image into dynamically discovered image understanding
        shell: bash
        run: |
          set -e
          echo '' | base64 -d > generation6.py
          alien-venv/bin/python generation6.py

      - name: Upload proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rightclick-alien-proof-${{ github.run_id }}
          path: alien-proof/
          if-no-files-found: error
          retention-days: 7
