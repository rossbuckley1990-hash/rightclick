name: RCIR production OpenAPI
on:
  pull_request:
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'scripts/*rcir*'
      - '.github/workflows/rcir-production.yml'
      - 'Package.*'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rcir-production-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  production:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Actual engine and real HTTP effect controls
        run: |
          mkdir -p /tmp/rcir-evidence
          RCIR_DISPATCH_EVIDENCE=/tmp/rcir-evidence/native-effects swift test --force-resolved-versions --filter RCIRProductionDispatchTests
      - name: Real OpenAPI through exactly seven public operations
        run: python3 scripts/acceptance-rcir-openapi.py .build/debug/rightclick /tmp/rcir-evidence/public-mcp
      - name: Independently check signed claims and provider effect correlation
        run: |
          python3 -m venv /tmp/rcir-receipt-verifier
          /tmp/rcir-receipt-verifier/bin/python -m pip install cryptography==50.0.1
          /tmp/rcir-receipt-verifier/bin/python -m unittest discover -s Tests -p 'test_rcir_receipt_verifier.py' -v
          /tmp/rcir-receipt-verifier/bin/python scripts/acceptance-rcir-signed-evidence.py --public /tmp/rcir-evidence/public-mcp --native /tmp/rcir-evidence/native-effects --output /tmp/rcir-evidence/independent-signed-claims
      - name: Actual live schema drift and reacquisition without reconnecting
        run: python3 scripts/acceptance-rcir-openapi-freshness.py .build/debug/rightclick /tmp/rcir-evidence/live-schema
      - name: Preserve new-run transcripts, effects and signed receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rcir-production-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/rcir-evidence
          if-no-files-found: error
