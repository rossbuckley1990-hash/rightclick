name: Queue cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/queue-cleanup.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: rightclick-queue-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded macOS test runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.parse

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GH_REPO"]
          api = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "rightclick-queue-cleanup",
          }

          def request(url, method="GET"):
              req = urllib.request.Request(url, headers=headers, method=method)
              with urllib.request.urlopen(req) as r:
                  body = r.read()
                  return json.loads(body) if body else None

          runs = []
          for status in ("queued", "in_progress"):
              page = 1
              while True:
                  qs = urllib.parse.urlencode({
                      "status": status,
                      "per_page": 100,
                      "page": page,
                  })
                  data = request(f"{api}/actions/workflows/tests.yml/runs?{qs}")
                  batch = data.get("workflow_runs", [])
                  runs.extend(batch)
                  if len(batch) < 100:
                      break
                  page += 1

          # Keep only the newest meaningful run in each current lane:
          # - one main push
          # - one pull_request run per head branch
          keep = {}
          for run in sorted(runs, key=lambda r: r["run_number"], reverse=True):
              event = run.get("event")
              branch = run.get("head_branch")
              if event == "push":
                  if branch != "main":
                      continue
                  key = ("push", "main")
              elif event == "pull_request":
                  key = ("pull_request", branch)
              else:
                  key = (event, branch)
              keep.setdefault(key, run["id"])

          cancel = []
          for run in runs:
              event = run.get("event")
              branch = run.get("head_branch")
              if event == "push" and branch != "main":
                  cancel.append(run)
                  continue
              key = (event, branch)
              if event == "push" and branch == "main":
                  key = ("push", "main")
              if keep.get(key) != run["id"]:
                  cancel.append(run)

          print(f"active={len(runs)} keep={len(keep)} cancel={len(cancel)}")
          for run in sorted(cancel, key=lambda r: r["run_number"]):
              rid = run["id"]
              print(
                  "cancel",
                  run["run_number"],
                  run.get("event"),
                  run.get("head_branch"),
                  rid,
              )
              try:
                  request(f"{api}/actions/runs/{rid}/cancel", method="POST")
              except urllib.error.HTTPError as e:
                  # 409 means the run already transitioned while cleanup was executing.
                  if e.code != 409:
                      raise
          PY
