name: apply Linux AppKit portability guards

on:
  push:
    branches:
      - fix/linux-appkit-test-guard-20261008
    paths:
      - .github/workflows/linux-appkit-guard-fix.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/linux-appkit-test-guard-20261008
          fetch-depth: 0
      - name: Guard macOS-only tests and probe
        run: |
          python3 - <<'PY'
          from pathlib import Path

          test = Path('Tests/RightClickCoreTests/ServiceRTFUnicodeTests.swift')
          s = test.read_text()
          if not s.startswith('#if canImport(AppKit)\n'):
              test.write_text('#if canImport(AppKit)\n' + s.rstrip() + '\n#endif\n')

          probe = Path('Sources/RightClickProbe/main.swift')
          s = probe.read_text()
          guard = '#if canImport(AppKit) && canImport(AVFoundation) && canImport(CoreGraphics)\n'
          fallback = '''\n#else
          @main
          struct RightClickProbeUnsupportedPlatform {
              static func main() {
                  print("rightclick-probe unavailable: requires macOS AppKit/AVFoundation/CoreGraphics")
              }
          }
          #endif
          '''
          if not s.startswith(guard):
              probe.write_text(guard + s.rstrip() + fallback)
          PY
          git diff --check
      - name: Linux test
        run: swift test
      - name: Linux release build
        run: swift build -c release
      - name: Cleanup policy regressions
        run: python3 scripts/ci/queue_cleanup_policy.py --self-test
      - name: Commit verified repair and remove bootstrap workflow
        run: |
          set -euo pipefail
          rm .github/workflows/linux-appkit-guard-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Tests/RightClickCoreTests/ServiceRTFUnicodeTests.swift Sources/RightClickProbe/main.swift .github/workflows/linux-appkit-guard-fix.yml
          git commit -m 'fix(linux): guard macOS-only probe and Unicode tests' -m 'Verified on ubuntu-latest with swift test, swift build -c release, and 51 cleanup-policy cases.'
          git push origin HEAD:fix/linux-appkit-test-guard-20261008