name: RIGHTCLICK Alien Cloud Remote Preflight
on:
  push:
    branches:
      - experiment/alien-cloud-first-contact-20261007
    paths:
      - '.github/workflows/alien-cloud-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remote-preflight:
    name: Actual Ubuntu cloud reachability and harness syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Inspect harness and verify external cloud accessibility without mutation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/experiments/alien-cloud-first-contact.py
          mkdir -p "$RUNNER_TEMP/alien-cloud-preflight"
          python3 - <<'PY'
          import json, pathlib, runpy, urllib.request, datetime, os
          namespace = runpy.run_path('scripts/experiments/alien-cloud-first-contact.py')
          spec = namespace['cloud_contract']()
          assert spec['openapi'] == '3.0.3'
          assert set(spec['paths']) == {'/objects', '/objects/{id}'}
          with urllib.request.urlopen('https://api.restful-api.dev/objects', timeout=25) as r:
              status = r.status
              body = json.load(r)
          assert status == 200 and isinstance(body, list)
          receipt = {'status': 'PASS', 'at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                     'remote_get_status': status, 'seed_records': len(body),
                     'contract_paths': sorted(spec['paths']), 'harness_syntax': 'PASS',
                     'remote_mutation_not_exercised': True, 'sha': os.environ['GITHUB_SHA']}
          path = pathlib.Path(os.environ['RUNNER_TEMP'])/'alien-cloud-preflight'/'receipt.json'
          path.write_text(json.dumps(receipt, indent=2)+'\n')
          print(json.dumps(receipt))
          PY
      - name: Preserve actual cloud preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alien-cloud-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/alien-cloud-preflight
          if-no-files-found: warn
          retention-days: 7

