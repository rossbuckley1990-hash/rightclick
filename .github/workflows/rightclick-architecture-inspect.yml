name: RIGHTCLICK source evidence

on:
  push:
    branches:
      - rightclick-readonly-web-provider

permissions:
  contents: write

jobs:
  emit:
    if: ${{ startsWith(github.event.head_commit.message, 'Emit RIGHTCLICK source evidence') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Emit relevant source as bounded evidence commits
        shell: bash
        run: |
          python3 - <<'PY'
          import os,re,textwrap,subprocess
          files=[
            "Sources/RightClickProviders/ConfiguredOpenAPISource.swift",
            "Sources/RightClickProviders/OriginPinnedHTTP.swift",
            "Sources/RightClickProviders/OpenAPIAuthority.swift",
          ]
          payloads=[]
          for p in files:
              text=open(p,encoding="utf-8",errors="replace").read()
              size=6200
              chunks=[text[i:i+size] for i in range(0,len(text),size)]
              for idx,ch in enumerate(chunks,1):
                  payloads.append((p,idx,len(chunks),ch))
          p="Sources/RightClickProviders/OpenAPIReflector.swift"
          lines=open(p,encoding="utf-8",errors="replace").read().splitlines()
          pats=[
            r"OriginPinnedHTTP",r"URLRequest",r"httpMethod",r"execute",
            r"canonicalAuthorityOrigin",r"redirect",r"authority",
            r"operationByCapabilityID",r"requiresConfirmation",r"safety"
          ]
          hit=set()
          rx=re.compile("|".join(pats),re.I)
          for i,l in enumerate(lines):
              if rx.search(l):
                  for j in range(max(0,i-18),min(len(lines),i+35)):
                      hit.add(j)
          ordered=sorted(hit)
          groups=[]
          cur=[]
          prev=None
          for j in ordered:
              if prev is None or j<=prev+1:
                  cur.append(j)
              else:
                  groups.append(cur); cur=[j]
              prev=j
          if cur: groups.append(cur)
          extract=[]
          for g in groups:
              extract.append(f"--- LINES {g[0]+1}-{g[-1]+1} ---")
              extract.extend(f"{j+1}: {lines[j]}" for j in g)
          text="\n".join(extract)
          size=6200
          chunks=[text[i:i+size] for i in range(0,len(text),size)]
          for idx,ch in enumerate(chunks,1):
              payloads.append((p+"#relevant",idx,len(chunks),ch))
          for p,idx,total,ch in payloads:
              msg=f"RIGHTCLICK_SOURCE\nPATH={p}\nCHUNK={idx}/{total}\n"+ch
              open("/tmp/rightclick-msg.txt","w").write(msg[:7600])
              subprocess.run(["git","commit","--allow-empty","-F","/tmp/rightclick-msg.txt"],check=True)
          PY
          git config user.name "rightclick-evidence"
          git config user.email "rightclick-evidence@users.noreply.github.com"
          # author identity must be configured before commits; amend by rerunning script after config
        continue-on-error: true
      - name: Emit with configured identity
        shell: bash
        run: |
          git config user.name "rightclick-evidence"
          git config user.email "rightclick-evidence@users.noreply.github.com"
          python3 - <<'PY'
          import os,re,subprocess
          files=[
            "Sources/RightClickProviders/ConfiguredOpenAPISource.swift",
            "Sources/RightClickProviders/OriginPinnedHTTP.swift",
            "Sources/RightClickProviders/OpenAPIAuthority.swift",
          ]
          payloads=[]
          for p in files:
              text=open(p,encoding="utf-8",errors="replace").read()
              size=6200
              chunks=[text[i:i+size] for i in range(0,len(text),size)]
              for idx,ch in enumerate(chunks,1):
                  payloads.append((p,idx,len(chunks),ch))
          p="Sources/RightClickProviders/OpenAPIReflector.swift"
          lines=open(p,encoding="utf-8",errors="replace").read().splitlines()
          rx=re.compile(r"OriginPinnedHTTP|URLRequest|httpMethod|execute|canonicalAuthorityOrigin|redirect|authority|operationByCapabilityID|requiresConfirmation|safety",re.I)
          hit=set()
          for i,l in enumerate(lines):
              if rx.search(l):
                  for j in range(max(0,i-18),min(len(lines),i+35)):
                      hit.add(j)
          ordered=sorted(hit)
          groups=[]; cur=[]; prev=None
          for j in ordered:
              if prev is None or j<=prev+1: cur.append(j)
              else: groups.append(cur); cur=[j]
              prev=j
          if cur: groups.append(cur)
          extract=[]
          for g in groups:
              extract.append(f"--- LINES {g[0]+1}-{g[-1]+1} ---")
              extract.extend(f"{j+1}: {lines[j]}" for j in g)
          text="\n".join(extract)
          size=6200
          chunks=[text[i:i+size] for i in range(0,len(text),size)]
          for idx,ch in enumerate(chunks,1):
              payloads.append((p+"#relevant",idx,len(chunks),ch))
          for p,idx,total,ch in payloads:
              msg=f"RIGHTCLICK_SOURCE\nPATH={p}\nCHUNK={idx}/{total}\n"+ch
              open("/tmp/rightclick-msg.txt","w").write(msg[:7600])
              subprocess.run(["git","commit","--allow-empty","-F","/tmp/rightclick-msg.txt"],check=True)
          PY
          git push origin HEAD:rightclick-readonly-web-provider
