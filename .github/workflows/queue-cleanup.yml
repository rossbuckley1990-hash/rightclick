name: Queue cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/queue-cleanup.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: rightclick-queue-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded runs and remove cancelled duplicates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GH_REPO"]
          api = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "rightclick-queue-cleanup",
          }

          def request(url, method="GET"):
              req = urllib.request.Request(url, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as r:
                  body = r.read()
                  return json.loads(body) if body else None

          def workflow_runs():
              out = []
              page = 1
              while True:
                  qs = urllib.parse.urlencode({"per_page": 100, "page": page})
                  data = request(f"{api}/actions/workflows/tests.yml/runs?{qs}")
                  batch = data.get("workflow_runs", [])
                  out.extend(batch)
                  if len(batch) < 100:
                      return out
                  page += 1

          runs = workflow_runs()
          active = [
              r for r in runs
              if r.get("status") in {"queued", "in_progress", "waiting", "pending"}
          ]

          keep = {}
          for run in sorted(active, key=lambda r: r["run_number"], reverse=True):
              event = run.get("event")
              branch = run.get("head_branch")
              if event == "push":
                  if branch != "main":
                      continue
                  key = ("push", "main")
              elif event == "pull_request":
                  key = ("pull_request", branch)
              else:
                  key = (event, branch)
              keep.setdefault(key, run["id"])

          cancel = []
          for run in active:
              event = run.get("event")
              branch = run.get("head_branch")
              if event == "push" and branch != "main":
                  cancel.append(run)
                  continue
              key = ("push", "main") if event == "push" else (event, branch)
              if keep.get(key) != run["id"]:
                  cancel.append(run)

          print(f"active={len(active)} keep={len(keep)} cancel={len(cancel)}")
          for run in sorted(cancel, key=lambda r: r["run_number"]):
              rid = run["id"]
              print("cancel", run["run_number"], run.get("event"), run.get("head_branch"), rid)
              try:
                  request(f"{api}/actions/runs/{rid}/cancel", method="POST")
              except urllib.error.HTTPError as e:
                  if e.code not in (409, 422):
                      raise

          # Give GitHub a short window to transition cancellation requests.
          time.sleep(8)

          runs = workflow_runs()
          cancelled = [r for r in runs if r.get("conclusion") == "cancelled"]
          print(f"delete_cancelled={len(cancelled)}")
          for run in sorted(cancelled, key=lambda r: r["run_number"]):
              rid = run["id"]
              print("delete", run["run_number"], run.get("event"), run.get("head_branch"), rid)
              try:
                  request(f"{api}/actions/runs/{rid}", method="DELETE")
              except urllib.error.HTTPError as e:
                  if e.code not in (404, 409, 422):
                      raise
          PY
