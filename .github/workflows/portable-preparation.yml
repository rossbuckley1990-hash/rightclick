name: Portable source integrity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pinned-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Verify compatibility snapshot is exactly the reviewed upstream delta
        run: |
          python3 - <<'PY'
          import pathlib, hashlib, json
          root = pathlib.Path('Vendor/swift-sdk')
          m = json.loads((root/'UPSTREAM.json').read_text())
          assert m['revision'] == 'a0ae212ebf6eab5f754c3129608bc5557637e605'
          assert {p.relative_to(root).as_posix() for p in (root/'Sources/MCP').rglob('*') if p.is_file()} == set(m['files'])
          changed = []
          for name, entry in m['files'].items():
              path = root/name
              assert not path.is_symlink()
              data = path.read_bytes()
              assert hashlib.sha256(data).hexdigest() == entry['patched'], name
              if entry['patched'] != entry['upstream']:
                  changed.append(name)
                  assert data.count(b'#if canImport(EventSource)') == 2
                  assert hashlib.sha256(data.replace(b'#if canImport(EventSource)', b'#if !os(Linux)')).hexdigest() == entry['upstream']
          assert changed == ['Sources/MCP/Base/Transports/HTTPClientTransport.swift']
          assert hashlib.sha256((root/'Package.swift').read_bytes()).hexdigest() == m['manifest_sha256']
          assert hashlib.sha256((root/'LICENSE').read_bytes()).hexdigest() == m['license_sha256']
          print('PASS: upstream SDK production bytes, bounded patch, manifest and licence')
          PY
