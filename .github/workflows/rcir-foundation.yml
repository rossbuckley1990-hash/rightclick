name: RCIR foundation (not universal runtime acceptance)
on:
  pull_request:
    paths:
      - 'Sources/RightClickProtocol/CapabilityABI.swift'
      - 'Sources/RightClickProtocol/RCIR*.swift'
      - 'Tests/RightClickCoreTests/RCIR*Tests.swift'
      - 'scripts/test-rcir.sh'
      - '.github/workflows/rcir-foundation.yml'
  push:
    branches: [main]
    paths:
      - 'Sources/RightClickProtocol/CapabilityABI.swift'
      - 'Sources/RightClickProtocol/RCIR*.swift'
      - 'Tests/RightClickCoreTests/RCIR*Tests.swift'
      - 'scripts/test-rcir.sh'
      - '.github/workflows/rcir-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rcir-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - run: bash scripts/test-rcir.sh
  apple-cryptography:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - run: bash scripts/test-rcir.sh
