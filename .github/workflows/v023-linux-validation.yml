name: v0.2.3 Linux patched diagnostic

on:
  push:
    branches:
      - validation/v0.2.3-linux-20261008
    paths:
      - .github/workflows/v023-linux-validation.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 143d6065cb5d5fc96d482ac6d17a9cda735cdc88
          fetch-depth: 0
      - name: Simulate proposed RightClickProbe portability guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Sources/RightClickProbe/main.swift')
          s = p.read_text()
          guard = '#if canImport(AppKit) && canImport(AVFoundation) && canImport(CoreGraphics)\n'
          if not s.startswith(guard):
              p.write_text(guard + s.rstrip() + '\n#else\nprint("rightclick-probe unavailable: requires macOS AppKit/AVFoundation/CoreGraphics")\n#endif\n')
          PY
          git diff --check
      - name: Run patched exact-head gates and preserve diagnostics
        shell: bash
        run: |
          set +e
          test "$(git rev-parse HEAD)" = "143d6065cb5d5fc96d482ac6d17a9cda735cdc88"
          exact_rc=$?
          swift test > /tmp/v023-test.log 2>&1
          test_rc=$?
          swift build -c release > /tmp/v023-build.log 2>&1
          build_rc=$?
          python3 scripts/ci/queue_cleanup_policy.py --self-test > /tmp/v023-policy.log 2>&1
          policy_rc=$?
          verdict=PASS
          if [ $exact_rc -ne 0 ] || [ $test_rc -ne 0 ] || [ $build_rc -ne 0 ] || [ $policy_rc -ne 0 ]; then verdict=FAIL; fi
          {
            echo "candidate=143d6065cb5d5fc96d482ac6d17a9cda735cdc88"
            echo "simulated_probe_guard=true"
            echo "exact_rc=$exact_rc"
            echo "test_rc=$test_rc"
            echo "build_rc=$build_rc"
            echo "policy_rc=$policy_rc"
            echo "verdict=$verdict"
          } > /tmp/v023-summary.env
          tail -n 24 /tmp/v023-test.log | tr '\n' ' ' | cut -c1-1700 > /tmp/v023-test-tail.txt
          tail -n 16 /tmp/v023-build.log | tr '\n' ' ' | cut -c1-1100 > /tmp/v023-build-tail.txt
          tail -n 8 /tmp/v023-policy.log | tr '\n' ' ' | cut -c1-600 > /tmp/v023-policy-tail.txt
          exit 0

      - uses: actions/checkout@v4
        with:
          ref: validation/v0.2.3-linux-20261008
          fetch-depth: 0
      - name: Publish patched diagnostic result
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/v023-summary.env
          test_tail=$(cat /tmp/v023-test-tail.txt)
          build_tail=$(cat /tmp/v023-build-tail.txt)
          policy_tail=$(cat /tmp/v023-policy-tail.txt)
          mkdir -p validation-results
          cp /tmp/v023-summary.env validation-results/v0.2.3-linux-patched-143d6065cb5d5fc96d482ac6d17a9cda735cdc88.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation-results/v0.2.3-linux-patched-143d6065cb5d5fc96d482ac6d17a9cda735cdc88.txt
          git commit -m "validation(v0.2.3-linux-patched): $verdict exact=$exact_rc test=$test_rc build=$build_rc policy=$policy_rc" -m "candidate=143d6065cb5d5fc96d482ac6d17a9cda735cdc88" -m "test_tail=$test_tail" -m "build_tail=$build_tail" -m "policy_tail=$policy_tail"
          git push origin HEAD:validation/v0.2.3-linux-20261008