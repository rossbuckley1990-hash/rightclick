name: Portable fabric
on:
  pull_request:
  push:
    branches: [feature/portable-fabric-foundation]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portable-fabric-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    name: macOS arm64 regression
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Native platform and complete regression suite
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          swift --version | tee macos-toolchain.txt
          swift test --force-resolved-versions --jobs 4 2>&1 | tee macos-tests.log
          python3 scripts/acceptance-portable-fabric.py .build/debug/rightclick 2>&1 | tee macos-acceptance.log
          git diff --exit-code -- Package.resolved
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-fabric-${{ github.sha }}
          path: |
            macos-*.txt
            macos-*.log
          if-no-files-found: error
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    container: swift:6.3.3-noble
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - run: apt-get update && apt-get install -y python3 ca-certificates
      - name: Source and native platform
        run: |
          set -euo pipefail
          test "$(uname -m)" = '${{ matrix.arch }}'
          git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD > linux-source.txt
          uname -a > linux-platform.txt
          swift --version > linux-toolchain.txt
          sha256sum Package.resolved > linux-lockfile-sha256.txt
          swift package describe --type json > linux-package.json
      - name: Extracted modules
        run: |
          set -euo pipefail
          swift build --target RightClickProtocol --force-resolved-versions --jobs 4 2>&1 | tee linux-protocol-build.log
          swift build --target RightClickCore --force-resolved-versions --jobs 4 2>&1 | tee linux-core-build.log
          swift build --target RightClickMCP --force-resolved-versions --jobs 4 2>&1 | tee linux-mcp-build.log
      - name: Full available suite
        run: |
          set -euo pipefail
          swift test --force-resolved-versions --jobs 4 2>&1 | tee linux-tests.log
      - name: Release and package integrity
        run: |
          set -euo pipefail
          swift build -c release --product rightclick --force-resolved-versions --jobs 4 2>&1 | tee linux-release-build.log
          .build/release/rightclick version > linux-cli-version.txt
          sha256sum .build/release/rightclick > linux-binary-sha256.txt
          git -c safe.directory="$GITHUB_WORKSPACE" diff --exit-code -- Package.resolved
      - name: Portable MCP and provider demonstration
        run: |
          set -euo pipefail
          python3 scripts/acceptance-portable-fabric.py .build/release/rightclick 2>&1 | tee linux-acceptance.log
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-fabric-${{ matrix.arch }}-${{ github.sha }}
          path: |
            linux-*.txt
            linux-*.json
            linux-*.log
          if-no-files-found: error
