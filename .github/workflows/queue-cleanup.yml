name: CI queue cleanup (manual)

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded runs and remove cancelled duplicates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GH_REPO"]
          api = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "rightclick-ci-cleanup",
          }

          def request(url, method="GET"):
              req = urllib.request.Request(url, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as r:
                  body = r.read()
                  return json.loads(body) if body else None

          def list_runs():
              out = []
              page = 1
              while True:
                  qs = urllib.parse.urlencode({"per_page": 100, "page": page})
                  data = request(f"{api}/actions/workflows/tests.yml/runs?{qs}")
                  batch = data.get("workflow_runs", [])
                  out.extend(batch)
                  if len(batch) < 100:
                      return out
                  page += 1

          runs = list_runs()
          active = [
              r for r in runs
              if r.get("status") in {"queued", "in_progress", "waiting", "pending"}
          ]

          keep = {}
          for run in sorted(active, key=lambda r: r["run_number"], reverse=True):
              event = run.get("event")
              branch = run.get("head_branch")
              if event == "push":
                  if branch != "main":
                      continue
                  key = ("push", "main")
              elif event == "pull_request":
                  key = ("pull_request", branch)
              else:
                  key = (event, branch)
              keep.setdefault(key, run["id"])

          for run in active:
              event = run.get("event")
              branch = run.get("head_branch")
              stale = event == "push" and branch != "main"
              key = ("push", "main") if event == "push" else (event, branch)
              stale = stale or keep.get(key) != run["id"]
              if not stale:
                  continue
              try:
                  request(f"{api}/actions/runs/{run['id']}/cancel", method="POST")
              except urllib.error.HTTPError as e:
                  if e.code not in (409, 422):
                      raise

          time.sleep(5)

          deleted = 0
          for run in list_runs():
              if run.get("conclusion") != "cancelled":
                  continue
              try:
                  request(f"{api}/actions/runs/{run['id']}", method="DELETE")
                  deleted += 1
              except urllib.error.HTTPError as e:
                  if e.code not in (404, 409, 422):
                      raise

          print(f"active_lanes_kept={len(keep)}")
          print(f"cancelled_history_deleted={deleted}")
          PY
