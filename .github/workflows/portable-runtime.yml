name: Portable runtime
on:
  push:
    branches: [main, codex/portable-runtime]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - run: apt-get update && apt-get install -y python3 ca-certificates
      - run: swift test --force-resolved-versions
      - run: swift build -c release --product rightclick --force-resolved-versions
      - run: python3 scripts/acceptance-portable.py .build/release/rightclick
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057
        with:
          swift-version: swift-6.2-release
          swift-build: 6.2-RELEASE
      - run: swift test --force-resolved-versions
      - run: swift build -c release --product rightclick --force-resolved-versions
      - run: python scripts/acceptance-portable.py .build/release/rightclick.exe
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - run: swift test --force-resolved-versions
      - run: scripts/build-cli.sh
      - run: python3 scripts/acceptance-portable.py .build/release/rightclick
