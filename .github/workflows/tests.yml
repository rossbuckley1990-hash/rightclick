name: macOS tests
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: macos-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded macOS test runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          current_run = int(os.environ["CURRENT_RUN_ID"])
          current_branch = os.environ["CURRENT_BRANCH"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2026-03-10",
              "User-Agent": "rightclick-ci-queue-cleanup",
          }

          runs = []
          for page in range(1, 4):
              url = (
                  f"https://api.github.com/repos/{repo}/actions/workflows/"
                  f"tests.yml/runs?per_page=100&page={page}"
              )
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  batch = json.load(response).get("workflow_runs", [])
              runs.extend(batch)
              if len(batch) < 100:
                  break

          active_states = {"queued", "in_progress", "waiting", "pending"}
          active = [r for r in runs if r.get("status") in active_states]

          newest_by_branch = {}
          for run in sorted(
              active,
              key=lambda r: (r.get("created_at", ""), int(r["id"])),
              reverse=True,
          ):
              branch = run.get("head_branch") or f"run:{run['id']}"
              newest_by_branch.setdefault(branch, int(run["id"]))

          newest_by_branch[current_branch] = current_run

          cancelled = []
          kept = []
          for run in active:
              run_id = int(run["id"])
              branch = run.get("head_branch") or f"run:{run_id}"
              if run_id == newest_by_branch.get(branch):
                  kept.append((branch, run_id))
                  continue

              url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/cancel"
              req = urllib.request.Request(url, headers=headers, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      status = response.status
                  if status == 202:
                      cancelled.append((branch, run_id))
              except urllib.error.HTTPError as exc:
                  if exc.code not in (409, 422):
                      raise

          print(f"kept={len(kept)}")
          print(f"cancelled={len(cancelled)}")
          for branch, run_id in cancelled:
              print(f"cancelled {run_id} {branch}")
          PY

  test:
    needs: cleanup
    runs-on: macos-26
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: swift test --force-resolved-versions
      - run: scripts/build-cli.sh
      - run: python3 scripts/acceptance-setup.py "$PWD/.build/release/rightclick"
      - run: python3 scripts/acceptance-mcp.py "$PWD/.build/release/rightclick" /tmp/rightclick-mcp-acceptance
      - run: python3 scripts/acceptance-core-boundary.py "$PWD/.build/release/rightclick" /tmp/rightclick-core-acceptance /tmp/rightclick-mcp-acceptance/results.json
      - name: Require Apple Silicon and free Command Line Tools for CLI build
        run: |
          test "$(uname -m)" = arm64
          test -d /Library/Developer/CommandLineTools
          echo "DEVELOPER_DIR=/Library/Developer/CommandLineTools" >> "$GITHUB_ENV"
      - run: scripts/build-cli.sh
      - run: python3 scripts/package-source.py
