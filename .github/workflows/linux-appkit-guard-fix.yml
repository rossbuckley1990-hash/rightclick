name: apply Linux AppKit test guard

on:
  push:
    branches:
      - fix/linux-appkit-test-guard-20261008
    paths:
      - .github/workflows/linux-appkit-guard-fix.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/linux-appkit-test-guard-20261008
          fetch-depth: 0
      - name: Guard macOS-only test on non-AppKit platforms
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Tests/RightClickCoreTests/ServiceRTFUnicodeTests.swift')
          s = p.read_text()
          if not s.startswith('#if canImport(AppKit)\n'):
              p.write_text('#if canImport(AppKit)\n' + s.rstrip() + '\n#endif\n')
          PY
          git diff --check
      - name: Linux test
        run: swift test
      - name: Linux release build
        run: swift build -c release
      - name: Cleanup policy regressions
        run: python3 scripts/ci/queue_cleanup_policy.py --self-test
      - name: Commit verified repair and remove bootstrap workflow
        run: |
          set -euo pipefail
          rm .github/workflows/linux-appkit-guard-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Tests/RightClickCoreTests/ServiceRTFUnicodeTests.swift .github/workflows/linux-appkit-guard-fix.yml
          git commit -m 'test(linux): guard AppKit-only Unicode tests' -m 'Verified on ubuntu-latest with swift test, swift build -c release, and 51 cleanup-policy cases.'
          git push origin HEAD:fix/linux-appkit-test-guard-20261008