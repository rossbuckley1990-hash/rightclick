name: v0.2.3 Linux exact-head validation

on:
  push:
    branches:
      - validation/v0.2.3-linux-20261008
    paths:
      - .github/workflows/v023-linux-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d063fa35f8507adec9ea0c584f7fb96fd9822c3e
          fetch-depth: 0
      - run: test "$(git rev-parse HEAD)" = "d063fa35f8507adec9ea0c584f7fb96fd9822c3e"
      - run: swift test
      - run: swift build -c release
      - run: python3 scripts/ci/queue_cleanup_policy.py --self-test
      - run: git diff --exit-code

  evidence:
    if: always()
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/v0.2.3-linux-20261008
          fetch-depth: 0
      - name: Write durable result
        env:
          RESULT: ${{ needs.validate.result }}
        run: |
          set -euo pipefail
          verdict=FAIL
          if [ "$RESULT" = "success" ]; then verdict=PASS; fi
          mkdir -p validation-results
          printf 'candidate=d063fa35f8507adec9ea0c584f7fb96fd9822c3e\nlinux=%s\nresult=%s\n' "$RESULT" "$verdict" > validation-results/v0.2.3-linux-d063fa35f8507adec9ea0c584f7fb96fd9822c3e.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation-results/v0.2.3-linux-d063fa35f8507adec9ea0c584f7fb96fd9822c3e.txt
          git commit -m "validation(v0.2.3-linux): $verdict exact head d063fa35f8507adec9ea0c584f7fb96fd9822c3e"
          git push origin HEAD:validation/v0.2.3-linux-20261008