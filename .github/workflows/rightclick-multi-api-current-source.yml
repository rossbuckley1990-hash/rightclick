name: RIGHTCLICK remote multi-API current-source proof
on:
  push:
    branches:
      - experiment/multi-api-remote-20261007
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-macos:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Checkout exact current-source experiment branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Assert RIGHTCLICK production source unmodified
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only daf07d04ee11be59e3f499f370f0bba5df9998ad HEAD > /tmp/rightclick-changes.txt
          cat /tmp/rightclick-changes.txt
          if grep -E '^(Sources/|Tests/|Package.swift|Package.resolved)' /tmp/rightclick-changes.txt; then
            echo "Production runtime changes not permitted in isolated experiment" >&2
            exit 1
          fi
      - name: Build full RIGHTCLICK runtime from source on macOS
        shell: bash
        run: |
          set -euo pipefail
          swift --version
          swift build -c release --product rightclick --force-resolved-versions
          .build/release/rightclick version
          shasum -a 256 .build/release/rightclick
      - name: Restore immutable acceptance script and verify exact digest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          raw=gzip.decompress(base64.b64decode(""))
          digest=hashlib.sha256(raw).hexdigest()
          assert digest == "76b07dd9b88a7c0d04ddc9e78e10d8d21883539d6559ebf705db5a4848456874", digest
          p=pathlib.Path("rightclick-multi-api-measure.py")
          p.write_bytes(raw)
          print("HARNESS_SHA256="+digest)
          PY
      - name: Run seven-operation multi-API discovery and readback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rightclick-multi-api-evidence"
          cp rightclick-multi-api-measure.py "$RUNNER_TEMP/rightclick-multi-api-evidence/harness.py"
          python3 rightclick-multi-api-measure.py --binary .build/release/rightclick --output "$RUNNER_TEMP/rightclick-multi-api-evidence" --expected-commit "$GITHUB_SHA"
      - name: Preserve receipts and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rightclick-multi-api-current-source-${{ github.run_id }}
          path: ${{ runner.temp }}/rightclick-multi-api-evidence/*
          retention-days: 7
          if-no-files-found: warn
