name: RIGHTCLICK Alien Relay

on:
  push:
    branches:
      - experiment/alien-relay-20261007
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alien-relay:
    name: Remote Ubuntu capability-artifact resolution proof
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out experiment branch
        uses: actions/checkout@v4

      - name: Build portable RIGHTCLICK probe and resolve discovered AI skill artifacts
        shell: bash
        run: |
          set +e

          mkdir -p alien-proof
          OBSERVED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          REPO_SHA="$(git rev-parse HEAD 2>/dev/null)"
          GIT_STATUS=$?
          RUNNER_OS_VALUE="${RUNNER_OS:-unknown}"
          RUNNER_ARCH_VALUE="${RUNNER_ARCH:-unknown}"

          SWIFT_VERSION="$(swift --version 2>&1)"
          SWIFT_STATUS=$?

          swift build --product rightclick-ard-probe >alien-proof/portable-build.log 2>&1
          PORTABLE_BUILD_STATUS=$?

          BIN_DIR="$(swift build --show-bin-path 2>/dev/null)"
          BIN_PATH="${BIN_DIR}/rightclick-ard-probe"

          if [ -x "$BIN_PATH" ]; then
            "$BIN_PATH" live-hf-resolve >alien-proof/hf-resolve.log 2>&1
            RESOLVE_STATUS=$?
          else
            echo "portable probe binary not found at $BIN_PATH" >alien-proof/hf-resolve.log
            RESOLVE_STATUS=127
          fi

          export OBSERVED_AT REPO_SHA GIT_STATUS RUNNER_OS_VALUE RUNNER_ARCH_VALUE
          export SWIFT_VERSION SWIFT_STATUS PORTABLE_BUILD_STATUS BIN_PATH RESOLVE_STATUS

          python3 - <<'PY'
          import base64, json, os, pathlib

          log_path = pathlib.Path("alien-proof/hf-resolve.log")
          log = log_path.read_text(encoding="utf-8", errors="replace") if log_path.exists() else ""
          results = []

          for line in log.splitlines():
              if not line.startswith("HF_RESULT_") or "_BASE64=" not in line:
                  continue
              encoded = line.split("=", 1)[1]
              try:
                  decoded = base64.b64decode(encoded, validate=True)
                  results.append(json.loads(decoded))
              except Exception as exc:
                  results.append({"decode_error": str(exc), "raw": encoded})

          with open("alien-proof/hf-resolved-results.json", "w", encoding="utf-8") as f:
              json.dump(results, f, indent=2, sort_keys=True)

          success = (
              int(os.environ.get("GIT_STATUS", "999")) == 0
              and int(os.environ.get("SWIFT_STATUS", "999")) == 0
              and int(os.environ.get("PORTABLE_BUILD_STATUS", "999")) == 0
              and int(os.environ.get("RESOLVE_STATUS", "999")) == 0
              and "HF_SKILL_RESOLUTION=PASS" in log
              and len(results) > 0
          )

          proof = {
              "experiment": "RIGHTCLICK Alien Relay Generation 3",
              "observed_utc": os.environ.get("OBSERVED_AT"),
              "repository_commit_sha": os.environ.get("REPO_SHA"),
              "runner": {
                  "os": os.environ.get("RUNNER_OS_VALUE"),
                  "arch": os.environ.get("RUNNER_ARCH_VALUE"),
              },
              "procedure": "skills/rightclick/procedures/recursive-capability-expansion.v1.json",
              "recursive_path": [
                  "ChatGPT seven generic RIGHTCLICK operations",
                  "RIGHTCLICK reflected GitHub OpenAPI provider",
                  "GitHub-hosted Ubuntu runner",
                  "compiled rightclick-ard-probe",
                  "live Hugging Face ARD discovery endpoint",
                  "resolved application/ai-skill artifacts",
              ],
              "commands": [
                  {
                      "command": "git rev-parse HEAD",
                      "exit_status": int(os.environ.get("GIT_STATUS", "999")),
                  },
                  {
                      "command": "swift --version",
                      "exit_status": int(os.environ.get("SWIFT_STATUS", "999")),
                      "output": os.environ.get("SWIFT_VERSION", ""),
                  },
                  {
                      "command": "swift build --product rightclick-ard-probe",
                      "exit_status": int(os.environ.get("PORTABLE_BUILD_STATUS", "999")),
                      "log": "portable-build.log",
                  },
                  {
                      "command": f'{os.environ.get("BIN_PATH", "<unknown>")} live-hf-resolve',
                      "exit_status": int(os.environ.get("RESOLVE_STATUS", "999")),
                      "log": "hf-resolve.log",
                  },
              ],
              "resolved_result_count": len(results),
              "semantic_success": success,
              "verification_rule": "Success requires the portable probe to build, the live Hugging Face discovery call to return, and at least one machine-readable capability artifact to be serialized without inventing an executor.",
          }

          with open("alien-proof/rightclick-alien-proof.json", "w", encoding="utf-8") as f:
              json.dump(proof, f, indent=2, sort_keys=True)
          PY

          cat alien-proof/rightclick-alien-proof.json
          echo "--- resolved capability artifacts ---"
          cat alien-proof/hf-resolved-results.json

      - name: Upload proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rightclick-alien-proof-${{ github.run_id }}
          path: alien-proof/
          if-no-files-found: error
          retention-days: 7
