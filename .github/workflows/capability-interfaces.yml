name: Descriptor interface runtime proof
on:
  pull_request:
  push:
    branches: [main, codex/universal-descriptor-acquisition]
permissions:
  contents: read
jobs:
  genuine-mcp-wasm:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record exact candidate source
        env:
          RIGHTCLICK_CI_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p evidence/interface-ci
          test "$(git rev-parse HEAD)" = "$RIGHTCLICK_CI_SOURCE"
          git rev-parse HEAD > evidence/interface-ci/source-commit.txt
          git rev-parse HEAD:Sources > evidence/interface-ci/sources-tree.txt
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Provision official component tooling and SDK
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/component-tools" evidence/interface-ci
          case "$(uname -m)" in arm64) arch=aarch64;; x86_64) arch=x86_64;; *) exit 1;; esac
          curl --fail --location --retry 3 "https://github.com/bytecodealliance/wasmtime/releases/download/v49.0.2/wasmtime-v49.0.2-$arch-macos.tar.xz" -o "$RUNNER_TEMP/component-tools/wasmtime.tar.xz"
          curl --fail --location --retry 3 "https://github.com/bytecodealliance/wasm-tools/releases/download/v1.261.0/wasm-tools-1.261.0-$arch-macos.tar.gz" -o "$RUNNER_TEMP/component-tools/wasm-tools.tar.gz"
          tar -xJf "$RUNNER_TEMP/component-tools/wasmtime.tar.xz" -C "$RUNNER_TEMP/component-tools"
          tar -xzf "$RUNNER_TEMP/component-tools/wasm-tools.tar.gz" -C "$RUNNER_TEMP/component-tools"
          shasum -a 256 "$RUNNER_TEMP/component-tools/wasmtime.tar.xz" "$RUNNER_TEMP/component-tools/wasm-tools.tar.gz" > evidence/interface-ci/toolchain-sha256.txt
          echo "RIGHTCLICK_WASM_RUNTIME=$RUNNER_TEMP/component-tools/wasmtime-v49.0.2-$arch-macos/wasmtime" >> "$GITHUB_ENV"
          echo "RIGHTCLICK_WASM_TOOLS=$RUNNER_TEMP/component-tools/wasm-tools-1.261.0-$arch-macos/wasm-tools" >> "$GITHUB_ENV"
          python -m venv "$RUNNER_TEMP/mcp-venv"
          "$RUNNER_TEMP/mcp-venv/bin/pip" install 'mcp==1.30.0' 'cryptography==50.0.2'
      - name: Compile actual component and exact-source architectural tests
        run: |
          set -euo pipefail
          "$RIGHTCLICK_WASM_TOOLS" parse examples/universal-descriptors/fingerprint.component.wat -o "$RUNNER_TEMP/fingerprint.component.wasm"
          "$RIGHTCLICK_WASM_TOOLS" parse examples/universal-descriptors/typed-record.component.wat -o "$RUNNER_TEMP/typed-record.component.wasm"
          RIGHTCLICK_TEST_WASM_COMPONENT="$RUNNER_TEMP/fingerprint.component.wasm" RIGHTCLICK_TEST_WIT_TYPED_COMPONENT="$RUNNER_TEMP/typed-record.component.wasm" bash scripts/test-capability-interfaces.sh 2>&1 | tee evidence/interface-ci/architectural-tests.log
      - name: Bound execution history using exact production sources
        run: bash scripts/test-execution-retention.sh 2>&1 | tee evidence/interface-ci/execution-retention.log
      - name: Build candidate runtime
        run: swift build --force-resolved-versions --product rightclick --jobs 3
      - name: Prove the real seven-operation boundary
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/mcp-venv/bin/python" examples/universal-descriptors/mcp-proof-server.py --directory /private/tmp/rightclick-descriptor-mcp-effects > evidence/interface-ci/server.log 2>&1 &
          provider_pid=$!
          trap 'kill "$provider_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent http://127.0.0.1:19143/observe/not-ready > /dev/null; then break; fi
            sleep 1
          done
          "$RUNNER_TEMP/mcp-venv/bin/python" scripts/acceptance-capability-interfaces.py .build/debug/rightclick evidence/interface-ci/public \
            --component "$RUNNER_TEMP/fingerprint.component.wasm" --runtime "$RIGHTCLICK_WASM_RUNTIME" --tools "$RIGHTCLICK_WASM_TOOLS"
          "$RUNNER_TEMP/mcp-venv/bin/python" scripts/acceptance-wit-typed.py .build/debug/rightclick "$RUNNER_TEMP/typed-record.component.wasm" evidence/interface-ci/typed-wit \
            --runtime "$RIGHTCLICK_WASM_RUNTIME" --tools "$RIGHTCLICK_WASM_TOOLS" --source-sha "$(git rev-parse HEAD)" --receipt-verifier scripts/verify-rcir-receipt.py
          "$RUNNER_TEMP/mcp-venv/bin/python" scripts/acceptance-wit-explain.py .build/debug/rightclick "$RUNNER_TEMP/typed-record.component.wasm" evidence/interface-ci/wit-explain \
            --runtime "$RIGHTCLICK_WASM_RUNTIME" --tools "$RIGHTCLICK_WASM_TOOLS" --source-sha "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: descriptor-interface-evidence
          path: evidence/interface-ci
