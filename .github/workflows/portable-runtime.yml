name: Portable runtime delivery
on:
  pull_request:
  push:
    branches: [main, feature/portable-runtime-001]
permissions:
  contents: read
concurrency:
  group: portable-delivery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux
            os: ubuntu-latest
            container: swift:6.2.1@sha256:0e4716bd34384d22963a63afbdbc93be3129dfd0753185aa1ded27755abdcae8
          - id: macos
            os: macos-15
            container: ''
          - id: windows
            os: windows-2022
            container: ''
    name: Native ${{ matrix.id }} candidate
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 40
    steps:
      - if: matrix.id == 'linux'
        run: apt-get update && apt-get install -y --no-install-recommends python3
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - if: matrix.id == 'linux'
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - if: matrix.id == 'macos'
        run: echo "DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer" >> "$GITHUB_ENV"
      - if: matrix.id == 'windows'
        uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057
        with:
          swift-version: swift-6.2.1-release
          swift-build: 6.2.1-RELEASE
          build_arch: amd64
      - name: Native tests, real acceptance, package and relocated execution
        shell: bash
        run: |
          if [ "${{ matrix.id }}" = windows ]; then
            python scripts/portable-delivery.py ci --output dist/portable
          else
            python3 scripts/portable-delivery.py ci --output dist/portable
          fi
      - name: Retain candidate and exact validation evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portable-${{ matrix.id }}-${{ github.run_id }}
          path: |
            dist/portable/*.json
            dist/portable/*.log
            dist/portable/*-candidate.zip
            dist/portable/*.sha256
          retention-days: 14
          if-no-files-found: error
  clean-linux:
    needs: native
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    timeout-minutes: 15
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends python3 ca-certificates libcurl4t64 libxml2 libicu74 libatomic1 libbsd0 libstdc++6 zlib1g libssl3t64
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: portable-linux-${{ github.run_id }}
          path: /tmp/candidate
      - name: Execute verified bundle without Swift installed
        run: python3 scripts/portable-clean-linux.py /tmp/candidate dist/clean-linux
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portable-clean-linux-${{ github.run_id }}
          path: |
            dist/clean-linux/*.json
            dist/clean-linux/*.log
          retention-days: 14
