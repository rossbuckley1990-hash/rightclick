name: Ephemeral native Windows TLS proof relay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-proof-relay.yml'
      - 'scripts/proof-lab/windows-relay-*.ps1'
      - 'scripts/proof-lab/relay-envelope.ps1'
      - 'fixtures/proof-relay/operator-public-key.pem'
permissions:
  contents: read
concurrency:
  group: windows-proof-relay-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  relay:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/universal-proof-lab')
    runs-on: windows-2022
    timeout-minutes: 70
    env:
      RIGHTCLICK_RELAY_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Start restricted native Windows writer and read-only observer with authenticated TLS relays
        shell: pwsh
        run: ./scripts/proof-lab/windows-relay-start.ps1
      - name: Publish only encrypted credentials and public readiness evidence while the provider is live
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: live-windows-proof-connection
          path: evidence/windows-relay/*.json
          retention-days: 1
          if-no-files-found: error
      - name: Hold for operator withdrawal or the bounded one-hour expiry then remove identities and processes
        if: always() && env.RIGHTCLICK_WINDOWS_RELAY_STATE != ''
        shell: pwsh
        run: ./scripts/proof-lab/windows-relay-hold.ps1
      - name: Preserve public withdrawal evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-proof-withdrawal
          path: evidence/windows-relay/withdrawal.json
          retention-days: 1
          if-no-files-found: warn
