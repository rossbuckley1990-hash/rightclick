name: Resolve gRPC dependencies (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: swift package resolve
      - name: Emit exact lockfile
        run: |
          echo 'PACKAGE_RESOLVED_BEGIN'
          cat Package.resolved
          echo 'PACKAGE_RESOLVED_END'
