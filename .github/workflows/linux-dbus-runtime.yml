name: Reconciled native Linux D-Bus runtime
on:
  pull_request:
  push:
    branches: [feature/reconcile-portable-v023]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-dbus-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  native-linux-dbus:
    name: Native Linux ${{ matrix.arch }} private D-Bus
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    container: swift:6.3.3-noble
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      RIGHTCLICK_CI_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Provision native fixture prerequisites
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-venv openssl ca-certificates curl xz-utils dbus systemd python3-dbus python3-gi passwd util-linux
      - name: Preserve distinct kernel principals
        run: |
          set -euo pipefail
          useradd -u 1100 -m rcwriter
          useradd -u 1101 -m rcobserver
          useradd -u 1102 -m rcservice
      - name: Record exact candidate and native platform
        run: python3 scripts/ci/record-reconciliation-source.py evidence/linux-dbus/source.json --expected-arch '${{ matrix.arch }}'
      - name: Provision genuine writer-readable coexistence fixtures
        run: |
          set -euo pipefail
          python3 scripts/ci/provision-component-tools.py /opt/rightclick-coexistence-tools evidence/linux-dbus/tools.json
          python3 -m venv /opt/rightclick-coexistence-python
          /opt/rightclick-coexistence-python/bin/pip install 'mcp==1.30.0' 'cryptography==50.0.1' 'graphql-core==3.3.0' 'grpcio==1.78.0' 'grpcio-reflection==1.78.0' 'protobuf==6.33.6'
          /opt/rightclick-coexistence-python/bin/pip freeze > evidence/linux-dbus/python-package-versions.txt
          # Public pinned executable/dependency bits, not authority/configuration.
          find /opt/rightclick-coexistence-tools /opt/rightclick-coexistence-python -type d -exec chmod 755 {} +
          find /opt/rightclick-coexistence-python -type f -exec chmod a+r {} +
          echo 'RIGHTCLICK_COEXISTENCE_PYTHON=/opt/rightclick-coexistence-python/bin/python' >> "$GITHUB_ENV"
      - name: Compile actual component and prove writer access
        run: |
          set -euo pipefail
          chmod 555 "$RIGHTCLICK_WASM_RUNTIME" "$RIGHTCLICK_WASM_TOOLS"
          "$RIGHTCLICK_WASM_TOOLS" parse examples/universal-descriptors/fingerprint.component.wat -o /opt/rightclick-coexistence-tools/fingerprint.component.wasm
          chmod 444 /opt/rightclick-coexistence-tools/fingerprint.component.wasm
          echo 'RIGHTCLICK_WASM_COMPONENT=/opt/rightclick-coexistence-tools/fingerprint.component.wasm' >> "$GITHUB_ENV"
          runuser -u rcwriter -- "$RIGHTCLICK_WASM_RUNTIME" --version
          runuser -u rcwriter -- "$RIGHTCLICK_WASM_TOOLS" --version
          runuser -u rcwriter -- /opt/rightclick-coexistence-python/bin/python -c 'import cryptography, graphql, grpc, grpc_reflection, mcp'
          PYTHONDONTWRITEBYTECODE=1 python3 -W error::ResourceWarning -m unittest discover \
            -s scripts/tests -p test_dbus_coexistence_hook.py -v \
            2>&1 | tee evidence/linux-dbus/coexistence-adapter-controls.log
          PYTHONDONTWRITEBYTECODE=1 python3 -W error::ResourceWarning -m unittest discover \
            -s scripts/tests -p test_linux_dbus_principals.py -v \
            2>&1 | tee evidence/linux-dbus/principal-controls.log
      - name: Typed compiler and genuine final-gate owner controls
        env:
          RIGHTCLICK_TEST_DBUS_NATIVE: '1'
        run: |
          set -euo pipefail
          bash scripts/ci/run-fixture-tests.sh \
            'DBusRuntimeTests|DBusNativeOwnerAcceptanceTests|CapabilityTypedCoreBoundaryTests' \
            evidence/linux-dbus/native-tests.log evidence/linux-dbus/native-outcomes.json \
            --require-class DBusRuntimeTests --require-class DBusNativeOwnerAcceptanceTests \
            --require-class CapabilityTypedCoreBoundaryTests \
            --not-compiled DBusRuntimeTests/testAbsentXMLParserCannotClaimDirectNativeCapabilities
      - name: Build the candidate runtime
        run: |
          set -euo pipefail
          swift build -c release --product rightclick --force-resolved-versions --jobs 4 2>&1 | tee evidence/linux-dbus/runtime-build.log
          sha256sum .build/release/rightclick > evidence/linux-dbus/binary-sha256.txt
      - name: Actual seven operations, automatic discovery and independent native effect
        run: |
          set -euo pipefail
          python3 scripts/acceptance-linux-dbus.py .build/release/rightclick evidence/linux-dbus/public-mcp --coexistence
          git -c safe.directory="$GITHUB_WORKSPACE" diff --exit-code
      - name: Preserve public evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dbus-${{ matrix.arch }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/linux-dbus
          if-no-files-found: error
