name: RIGHTCLICK OpenAPI parser evidence
on:
  push:
    branches: [rightclick-readonly-web-provider]
permissions:
  contents: write
jobs:
  emit:
    if: ${{ startsWith(github.event.head_commit.message, 'Emit RIGHTCLICK parser evidence') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - shell: bash
        run: |
          git config user.name "rightclick-evidence"
          git config user.email "rightclick-evidence@users.noreply.github.com"
          {
            echo RIGHTCLICK_PARSER_EVIDENCE
            grep -n -C 20 -E 'allowedOperationKeys|operationKeys|let allowed.*Keys|Operation\(' Sources/RightClickCore/OpenAPIReflector.swift | head -n 260
          } > /tmp/msg.txt
          head -c 14000 /tmp/msg.txt > /tmp/bounded.txt
          git commit --allow-empty -F /tmp/bounded.txt
          git push origin HEAD:rightclick-readonly-web-provider
